window.addEventListener('load', () => {
    // 获取版本按钮元素
    const verBtn = document.getElementById('htdbwzButton');
    if (!verBtn) return; // 找不到按钮直接退出，防止报错
    // 正则：匹配「版本：」后面的数字。
    const text = verBtn.innerText.trim();
    const matchResult = text.match(/版本：(\d+)/);
    if (!matchResult) return; // 格式不对就不执行版本检测。
    const PAGE_VERSION = matchResult[1];

    const localVer = localStorage.getItem('Html_hengze_version');
    if(localVer !== PAGE_VERSION){
        localStorage.setItem('Html_hengze_version', PAGE_VERSION);
        // 版本不一样，强制刷新一次。
        location.reload(true);
    }
});



        // 工具：把日期转成 Date对象，固定2026年
        function parseMd(str){
            const arr = str.split('.');
            const m = parseInt(arr[0])-1;
            const d = parseInt(arr[1]);
            return new Date(2026, m, d);
        }

        // 计算两个日期相差整天数
        function diffDay(a,b){
            const msPerDay = 24*60*60*1000;
            const t1 = new Date(a.getFullYear(),a.getMonth(),a.getDate()).getTime();
            const t2 = new Date(b.getFullYear(),b.getMonth(),b.getDate()).getTime();
            return Math.round((t1 - t2)/msPerDay);
        }

        // 处理天前逻辑
        function handleDayText(){
            const rows = document.querySelectorAll("#bg > .row");
            const today = new Date();
            for(let r of rows){
                const rightBtn = r.querySelector(".RightButton");
                if(!rightBtn) continue;
                let txt = rightBtn.innerText.trim();
                if(!txt) continue;
                //取出原始日期字符串，例如"10.31"
                let dateStr = txt.split('\n')[0].trim();
                if(!/^\d+\.\d+$/.test(dateStr)) continue;

                const itemDate = parseMd(dateStr);
                const delta = diffDay(today, itemDate);
                const showDelta = Math.max(0, delta);
                rightBtn.innerText = `${dateStr} · ${showDelta}天前`;
                // >=4天改颜色。
                if(showDelta >=4){
                    rightBtn.style.color = "red";
                }else{
                    rightBtn.style.color = "";
                }
            }
        }
        //处理，忽略"又"后面文字，提取第一个数字，<=4变红
        function handleEnterButton(){
            const els = document.querySelectorAll(".CenterButton");
            for(let el of els){
                let fullText = el.innerText;
                //截断：遇到“又”直接舍弃后面全部内容
                const youIndex = fullText.indexOf("又");
                let workText = youIndex !== -1 ? fullText.slice(0,youIndex) : fullText;
                //提取第一个数字（支持小数）
                const match = workText.match(/[\d\.]+/);
                if(!match){
                    el.style.color = "";
                    continue;
                }
                const num = parseFloat(match[0]);
                if(num <=4){
                    el.style.color = "red";
                }else{
                    el.style.color = "";
                }
            }
        }
        window.onload = function(){
            handleDayText();
            handleEnterButton();
        }



function extractToButton() {
  const rows = document.querySelectorAll('.row');
  let result = '#储备 {\n';

  // 自定义阈值配置。
  const customThreshold = {
    '牛肉': 30,
    '猪肉': 30,
    '洋葱': 3,
    '食盐': 1,
    '十三香': 1
  };
  const defaultThreshold = 4;  // 默认阈值。
  rows.forEach(row => {
    const leftEl = row.querySelector('.LeftButton');
    const centerEl = row.querySelector('.CenterButton');
    if (!leftEl || !centerEl) return;
    let centerHtml = centerEl.innerHTML.replace(/<br\s*\/?>/gi, '，');
    const leftText = leftEl.innerText.trim();
    // 【特殊处理：左文本是"}"】
    if (leftText === '}') {
      result += `${leftText}`;
      return;
    }
    // 【特殊处理：左文本是"空"】
    if (leftText === '') {
      result += `\n`;
      return;
    }
    // 截断：在 又 / （制） 前面切断，丢弃后面内容
    let parseText = centerHtml;
    const cutPosList = [parseText.indexOf('又'), parseText.indexOf('（制）')];
    const validCutPos = cutPosList.filter(p => p !== -1);
    if (validCutPos.length > 0) {
      const cutAt = Math.min(...validCutPos);
      parseText = parseText.slice(0, cutAt);
    }
    // 提取数字
    const numMatch = parseText.match(/[\d\.]+/);
    let numVal = null;
    if (numMatch) {
      numVal = parseFloat(numMatch[0]);
    }
    // 获取当前这条的阈值
    const threshold = (leftText in customThreshold) ? customThreshold[leftText] : defaultThreshold;
    // 规则：有数字，并且数字 ≤ 阈值 才加入；Center为空也保留吗？你这里只过滤数字条件
    let canAdd = true;
    if (numVal !== null) {
      canAdd = numVal <= threshold;
    }
    if (canAdd) {
      result += `    ${leftText}：${centerHtml}\n`;
    }
  });
  const extractBtn = document.getElementById('extractButton');
  if (extractBtn) {
    extractBtn.innerText = result;
  }
  console.log(result);
}
window.addEventListener('load', extractToButton);




document.getElementById('extractButton').addEventListener('click', async function(){
    const sourceDom = document.getElementById('extractButton');
    const copyText = sourceDom.innerText;
    if(!copyText){
        alert("报错：The innerText Error！");
        return;
    }
    try{
        await navigator.clipboard.writeText(copyText);
        alert("已尝试复制到剪贴板");
    }catch(err){
        alert("报错：The Copy Error！" + err);
    }
})
